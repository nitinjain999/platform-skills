name: Tessl Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.26.15)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}
      - name: Set version in tile.json
        env:
          # A workflow_dispatch input is caller-supplied. ${{ }} is substituted
          # before bash parses the line, so interpolating it directly into the
          # run: block would let the caller inject shell.
          VERSION: ${{ inputs.version }}
        run: |
          jq --arg v "${VERSION}" '.version = $v' tile.json > tile.json.tmp && mv tile.json.tmp tile.json
      - name: Publish skill
        run: tessl tile publish .
