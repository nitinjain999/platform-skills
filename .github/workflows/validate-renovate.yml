name: Validate Renovate Config

on:
  pull_request:
    paths:
      - 'renovate.json'

permissions:
  contents: read

jobs:
  validate-schema:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate JSON syntax
        run: |
          if ! jq empty renovate.json; then
            echo "❌ renovate.json is not valid JSON"
            exit 1
          fi
          echo "✅ JSON syntax valid"

  validate-config:
    name: Config Validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '24'

      - name: Run renovate-config-validator
        run: |
          npx --package=renovate --yes renovate-config-validator renovate.json
          echo "✅ Config validation passed"

  validate-coverage:
    name: Coverage Scan
    runs-on: ubuntu-latest
    # Exposed so the summary job can distinguish "clean" from "warnings" —
    # the step itself exits 0 either way, so needs.*.result cannot tell them apart.
    outputs:
      uncovered_count: ${{ steps.coverage.outputs.uncovered_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check manager coverage
        id: coverage
        run: |
          UNCOVERED=0

          check_coverage() {
            local label="$1"
            local pattern="$2"
            local manager="$3"

            if find . -path "./.git" -prune -o -name "$pattern" -print | grep -q .; then
              if grep -q "\"$manager\"" renovate.json; then
                echo "✅ COVERED: $label ($manager)"
              else
                echo "⚠️  UNCOVERED: $label ($manager) — files found but manager not referenced in renovate.json"
                UNCOVERED=$((UNCOVERED + 1))
              fi
            else
              echo "ℹ️  SKIPPED: $label — no matching files found"
            fi
          }

          # Match both extensions — a repo using .yaml exclusively is still an
          # Actions repo, and matching only *.yml reports a false SKIPPED.
          if find .github/workflows \( -name "*.yml" -o -name "*.yaml" \) 2>/dev/null | grep -q .; then
            if grep -q '"github-actions"' renovate.json; then
              echo "✅ COVERED: GitHub Actions (github-actions)"
            else
              echo "⚠️  UNCOVERED: GitHub Actions (github-actions) — files found but manager not referenced in renovate.json"
              UNCOVERED=$((UNCOVERED + 1))
            fi
          else
            echo "ℹ️  SKIPPED: GitHub Actions — no matching files found"
          fi

          check_coverage "Terraform"      "*.tf"              "terraform"
          check_coverage "Helm"           "Chart.yaml"        "helmv3"
          check_coverage "Go modules"     "go.mod"            "gomod"
          check_coverage "npm"            "package.json"      "npm"
          check_coverage "Python"         "requirements*.txt" "pip_requirements"
          check_coverage "Docker"         "Dockerfile"        "dockerfile"
          check_coverage "Rust"           "Cargo.toml"        "cargo"

          if [ "$UNCOVERED" -gt 0 ]; then
            echo ""
            echo "⚠️  $UNCOVERED ecosystem(s) detected but not covered by Renovate"
            echo "Run /platform-skills:renovate generate to update your renovate.json"
          else
            echo "✅ All detected ecosystems are covered"
          fi

          # Publish the count so the summary job can surface it. Coverage gaps are
          # advisory — the step stays exit 0 so a gap never blocks the PR.
          echo "uncovered_count=$UNCOVERED" >> "$GITHUB_OUTPUT"

  summary:
    name: Renovate Config Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-schema, validate-config, validate-coverage]
    if: always()
    steps:
      - name: Post summary
        env:
          SCHEMA_RESULT: ${{ needs.validate-schema.result }}
          CONFIG_RESULT: ${{ needs.validate-config.result }}
          COVERAGE_RESULT: ${{ needs.validate-coverage.result }}
          UNCOVERED_COUNT: ${{ needs.validate-coverage.outputs.uncovered_count }}
        run: |
          status() { [ "$1" = "success" ] && echo "✅ Passed" || echo "❌ Failed"; }

          # A green validate-coverage job only means the scan ran. Read the count
          # to tell "all ecosystems covered" apart from "gaps found but advisory".
          if [ "$COVERAGE_RESULT" != "success" ]; then
            COVERAGE_CELL="❌ Failed"
          elif [ "${UNCOVERED_COUNT:-0}" -gt 0 ]; then
            COVERAGE_CELL="⚠️ ${UNCOVERED_COUNT} uncovered — see Coverage Scan log"
          else
            COVERAGE_CELL="✅ Passed"
          fi

          {
            echo "## Renovate Config Validation"
            printf "| Check | Status |\n|-------|--------|\n"
            printf "| JSON Schema | %s |\n" "$(status "$SCHEMA_RESULT")"
            printf "| Config Validator | %s |\n" "$(status "$CONFIG_RESULT")"
            printf "| Coverage Scan | %s |\n" "$COVERAGE_CELL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce required checks
        env:
          SCHEMA_RESULT: ${{ needs.validate-schema.result }}
          CONFIG_RESULT: ${{ needs.validate-config.result }}
        run: |
          if [ "$SCHEMA_RESULT" != "success" ] || [ "$CONFIG_RESULT" != "success" ]; then
            echo "❌ Required validation checks failed — see jobs above"
            exit 1
          fi
          echo "✅ All required checks passed"
