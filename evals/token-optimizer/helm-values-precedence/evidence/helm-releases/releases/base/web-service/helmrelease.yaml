apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: web-service
  namespace: apps
spec:
  interval: 10m
  chart:
    spec:
      chart: ./helm/web-service
      sourceRef:
        kind: GitRepository
        name: platform-charts
        namespace: flux-system
  values:
    replicaCount: 3
    image:
      repository: ghcr.io/example/web-service
      tag: "v1.5.0"
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        memory: 1Gi
