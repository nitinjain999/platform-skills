---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: HelmRelease
      name: envoy-gateway
    patch: |-
      - op: replace
        path: /spec/values/deployment/replicas
        value: 1
      - op: replace
        path: /spec/values/deployment/envoyGateway/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/values/deployment/envoyGateway/resources/requests/memory
        value: "128Mi"
  - target:
      kind: HelmRelease
      name: cert-manager
    patch: |-
      - op: replace
        path: /spec/values/replicaCount
        value: 1
