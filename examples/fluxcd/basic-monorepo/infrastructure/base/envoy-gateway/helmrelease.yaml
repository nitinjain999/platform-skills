---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  maxHistory: 3
  install:
    # The chart ships the Envoy Gateway and Gateway API CRDs in crds/.
    # Helm never upgrades crds/ on its own; CreateReplace keeps them current.
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  uninstall:
    keepHistory: false
  values:
    # Control plane only. Envoy proxy replicas are set per GatewayClass through
    # the EnvoyProxy resource in infrastructure/configs.
    deployment:
      replicas: 2
      envoyGateway:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1024Mi
