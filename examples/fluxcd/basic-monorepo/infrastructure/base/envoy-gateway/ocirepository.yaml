---
# Envoy Gateway publishes its chart only as an OCI artifact, so it is pulled with
# an OCIRepository and referenced from the HelmRelease via chartRef.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 12h
  url: oci://docker.io/envoyproxy/gateway-helm
  ref:
    tag: v1.9.2  # Pinned. Bundles Gateway API v1.6.1 CRDs; upgrade is an explicit PR
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
