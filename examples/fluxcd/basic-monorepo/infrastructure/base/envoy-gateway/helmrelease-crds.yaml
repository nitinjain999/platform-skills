---
# Gateway API and Envoy Gateway CRDs, managed apart from the controller so the
# channel is an explicit choice. The controller chart's bundled CRDs are the
# experimental channel, and its admission policy rejects them on clusters that
# already have standard-channel CRDs (GKE installs those by default).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gateway-crds
  namespace: envoy-gateway-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: gateway-crds
  maxHistory: 3
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    crds:
      gatewayAPI:
        enabled: true
        channel: standard  # Experimental fields stay off unless deliberately chosen
      envoyGateway:
        enabled: true
  # Blast radius: deleting a CRD deletes every Gateway and HTTPRoute in the
  # cluster. Mark them keep so removing this HelmRelease never cascades.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CustomResourceDefinition
            patch: |-
              - op: add
                path: /metadata/annotations/helm.sh~1resource-policy
                value: keep
