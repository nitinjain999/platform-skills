---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: HelmRelease
      name: envoy-gateway
    patch: |-
      - op: add
        path: /spec/values/deployment/envoyGateway/resources/limits/cpu
        value: "1000m"
  - target:
      kind: HelmRelease
      name: cert-manager
    patch: |-
      - op: replace
        path: /spec/values/replicaCount
        value: 3
