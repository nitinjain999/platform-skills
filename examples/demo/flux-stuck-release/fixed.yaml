apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 10m  # poll for chart updates every 10 min, not 1h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  interval: 10m
  timeout: 5m           # fail fast — don't block other reconciliations
  dependsOn:
    - name: cert-manager # trust-manager's webhook certificate needs cert-manager CRDs first
      namespace: cert-manager
  chart:
    spec:
      chart: trust-manager
      version: "v0.25.0"  # pinned — upgrade is an explicit PR, not automatic
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    remediation:
      retries: 3          # retry install on failure before giving up
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true  # roll back if the last upgrade failed
    cleanupOnFail: true
  values:
    replicaCount: 2     # HA: survive a node drain during upgrades
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi   # memory only: a CPU limit throttles the webhook under load
